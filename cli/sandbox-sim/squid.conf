http_port 3128
acl allowed dstdomain "/etc/squid/allowlist.txt"
http_access allow CONNECT allowed
http_access allow allowed
http_access deny all
# The synthetic refusal Claude's sandbox answers with (#212): a 403 naming the reason.
reply_header_add X-Deny-Reason "host_not_allowed" !allowed
access_log daemon:/var/log/squid/access.log squid
cache deny all
