build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

complexity:
  LargeClass:
    active: true
    excludes:
      # The widest interface in the app, and the count is the interface's rather than a cohesion
      # problem: one class owns publish, single-card edits, batched appends, delete, move, media
      # re-hosting, compaction, listing, sync, following and cloning — because every one of them
      # is a manifest read-modify-write that has to serialize behind the same per-deck lock
      # (Architecture.md §8.0). The parts that could leave already have: `DeckMediaSweeper` and
      # `AccountEraser` are collaborators, and `CardChunking` owns the chunk arithmetic.
      #
      # The real seam is the "following someone else's deck" block, and `DeckRepository`'s own
      # KDoc records why it is not taken: `listFollowed` has to merge with `listOwned` behind one
      # `changes` flow, and `DiscoveryRepository` already depends on this one. Splitting it means
      # deciding where that flow lives, which is the `core`/`presentation` question (#54, open
      # question 5), not a lint fix.
      - '**/data/repository/impl/DeckRepositoryImpl.kt'
  LongParameterList:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/jvmTest/**'
      - '**/src/test/kotlin/**'
      - '**/testing/**'
      # Seven injected collaborators, not a parameter-object smell: the widest repository in the
      # app plus an injectable coroutine scope, which exists so a test can await a deletion that
      # would otherwise be invisible to `runTest`.
      - '**/data/repository/impl/IdentityRepositoryImpl.kt'
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
  TooManyFunctions:
    active: true
    ignoreAnnotated: ['Composable']
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    excludes:
      # A test class's function count is how much behaviour it pins down, not a cohesion problem.
      # Splitting one to satisfy a threshold makes the suite harder to read for nothing.
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/jvmTest/**'
      - '**/src/test/kotlin/**'
      - '**/data/pubky/PubkyClient.kt'
      - '**/data/pubky/UniffiPubkyClient.kt'
      # Same reason as the two above: a wide interface, and the count is the interface's, not a
      # cohesion problem in the implementation.
      - '**/data/repository/impl/DiscoveryRepositoryImpl.kt'
      # Likewise. IdentityRepository covers Ring auth, local keys, profiles and account deletion —
      # the widest interface in the app — and the heavy parts are already split out into their own
      # collaborators (AccountEraser).
      - '**/data/repository/impl/IdentityRepositoryImpl.kt'
      # The interface itself, for the same reason. It is one identity surface with four genuinely
      # distinct jobs — Ring auth, local key custody, registering an unregistered key, and the
      # profile — and splitting it would only move the count somewhere that then has to depend on
      # the same private session-persisting sequence. Note this file also holds the *other* eight
      # repository interfaces; the rule counts per declaration, so they are unaffected.
      - '**/data/repository/Repositories.kt'
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/testing/**'

exceptions:
  TooGenericExceptionCaught:
    active: true
    excludes:
      - '**/data/pubky/UniffiPubkyClient.kt'
      - '**/data/pubky/IosPubkyClient.kt'
      # The CLI's one process-level boundary. Anything that escapes a command has to become an
      # exit code rather than a stack trace and a status of 0 — which is exactly what catching
      # narrowly here would produce for the failure nobody predicted.
      - '**/cli/Main.kt'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  MatchingDeclarationName:
    active: true
    mustBeFirst: true
    excludes:
      - '**/Platform.android.kt'
      - '**/Platform.ios.kt'
      - '**/Platform.jvm.kt'
      - '**/domain/model/Media.kt'
      # A CLI command file is named for the command it implements. The command is a function; the
      # class in it is that function's `--json` result, and naming the file after the result would
      # make the surface harder to navigate, not easier.
      - '**/cli/commands/*.kt'
      - '**/cli/Runtime.kt'
  ConstructorParameterNaming:
    active: true
    excludes:
      - '**/data/pubky/*Dtos.kt'
      - '**/data/pubky/*Dto.kt'
      - '**/data/nexus/*.kt'
      - '**/data/unsplash/*.kt'

style:
  ThrowsCount:
    active: true
    max: 2
    excludes:
      # A CLI command's throws *are* its contract: each one is a distinct exit code an agent
      # branches on, so collapsing them into one would collapse the codes with them.
      - '**/cli/commands/*.kt'
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    ignoreNumbers: ['-1', '0', '1', '2', '100']
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreHashCodeFunction: true
    excludes:
      - '**/data/pubky/Hashing.jvm.kt'
      - '**/data/pubky/Hashing.ios.kt'
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/jvmTest/**'
      - '**/src/test/kotlin/**'
      - '**/testing/**'
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview', 'Composable']
  ReturnCount:
    active: true
    max: 5
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  # Key material comes from the FFI or it does not exist. `generate_mnemonic`/`Keypair::random`
  # draw from the OS CSPRNG and panic rather than degrade; a hand-rolled Random anywhere near a
  # key, passphrase or salt would silently produce a valid-looking account nobody can recover.
  # Scoped to the packages that touch keys — SessionRetry's backoff jitter and the confetti keep
  # their Random. `maxIssues: 0` above makes this a build failure, which is the intended severity.
  ForbiddenImport:
    active: true
    includes:
      - '**/data/pubky/**'
      - '**/data/storage/LocalKeyStore.kt'
      - '**/data/repository/impl/KeyBackupRepositoryImpl.kt'
      - '**/presentation/backup/**'
      - '**/presentation/restore/**'
    excludes:
      # Backoff jitter, not key material — it decides how long to sleep before retrying a write.
      # It sits in data/pubky only because that is where session retry lives.
      - '**/data/pubky/SessionRetry.kt'
    imports:
      - 'kotlin.random.Random'
      - 'java.util.Random'
      - 'java.security.SecureRandom'
  ForbiddenComment:
    active: false

formatting:
  active: true
  android: true
  autoCorrect: true
  Filename:
    active: false
  FunctionNaming:
    active: false
  MaximumLineLength:
    active: false
  NoUnusedImports:
    active: true
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  Wrapping:
    active: false

Compose:
  active: true
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: false
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    active: false
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: false
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  # Disabled: false-positives on the early-return loading idiom and on
  # section-fragment helpers that intentionally emit into a parent scope.
  MultipleEmitters:
    active: false
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: false
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberStateMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
