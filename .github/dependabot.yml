# Monthly dependency PRs, cut so that each one changes what a single part of CI tests.
#
# In every group below, minor and patch updates share one PR. A **major** is never grouped on
# the Gradle side: it gets a PR of its own, so a red run names the dependency that broke it.
#
# Not here, on purpose:
#   docker  for `cli/Dockerfile`: it pins `ubuntu:22.04` for the glibc floor (see the file),
#           and `debian:bookworm-slim` carries no version Dependabot can compare. Its only
#           possible PR would be the one that must not merge. `cli/sandbox-sim/Dockerfile.client`
#           is a local test harness and unpinned on purpose. `mcp/` and its edge are covered below.
#   GraalVM `GRAALVM_VERSION` in that Dockerfile and `java-version` in the workflows are plain
#           strings to Dependabot. They move by hand, together.
#   caddy-ratelimit  the commit `mcp/deploy/caddy/Dockerfile` hands `xcaddy --with` is a Go module
#           no ecosystem here sees. It moves by hand: check github.com/mholt/caddy-ratelimit
#           whenever the `mcp-edge-caddy` PR below arrives, since the module parses every
#           caller's `Authorization` header.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      # Most workflows pin major tags (`@v7`), which a minor release moves without a PR, so
      # `actions-minor` is in practice the `mcp-deploy.yml` group: that file pins exact commit
      # SHAs with the tag in a comment (#522), and every patch release of its actions yields one.
      # Merging it rolls staging. The release itself has already run on the PR through ci.yml's
      # floating major tags, except `docker/login-action`, which only mcp-deploy uses. An action
      # used only by `release.yml` is not exercised by the PR's own run either.
      actions-minor:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  # The MCP server's two eclipse-temurin bases, pinned by digest because staging deploys
  # whatever image `main` builds (#522). Weekly rather than monthly, because these digests are
  # how a base-image security fix reaches an internet-facing server. One PR for both, since the
  # builder and runtime move together; a JDK major is a deliberate move, not a dependency bump.
  # Both lines name `eclipse-temurin`, so check that a PR moves *both* digests.
  - package-ecosystem: docker
    directory: /mcp
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
    groups:
      mcp-base-images:
        patterns: ["*"]

  # The edge's Caddy (#518): builder and runtime on one version, since xcaddy builds the builder's
  # CADDY_VERSION. Merging a bump changes CI only; the VPS takes it when the binary is rebuilt by
  # hand (mcp/deploy/README.md), so a PR here is also the reminder to do that.
  - package-ecosystem: docker
    directory: /mcp/deploy/caddy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: caddy
        update-types: [version-update:semver-major]
    groups:
      mcp-edge-caddy:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    ignore:
      # Vendored under `shared/libs/maven` and tied to the Rust crate version inside
      # pubky-core-ffi-fork; it is on no registry Dependabot can read.
      - dependency-name: "rustls:rustls-platform-verifier"
      # 0.5.0 onwards compiles against detekt 2, which has published only alphas. Lift this
      # with the detekt 2 move — see `detektComposeRules` in gradle/libs.versions.toml.
      - dependency-name: "io.nlopez.compose.rules:detekt"
        versions: [">=0.5.0"]
    # First match wins, so `other` only collects what no group above it claimed.
    groups:
      # The compiler and its plugins. The one group that can break Kotlin/Native, so its PR is
      # the one whose iOS row matters.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlinx:*"
        update-types: [minor, patch]
      # How the build runs rather than what ships. A wrapper update rewrites
      # `distributionSha256Sum` too — check that it did.
      build-tooling:
        patterns:
          - "gradle-wrapper"
          - "com.android.application"
          - "com.android.kotlin.multiplatform.library"
          - "org.gradle.toolchains.foojay-resolver-convention"
          - "io.gitlab.arturbosch.detekt*"
        update-types: [minor, patch]
      # What reaches the `native-image` binary. Reachability metadata is hand-curated against
      # these, so this PR is unverified until all three CLI binary rows have compiled it.
      cli-native:
        patterns:
          - "org.graalvm.buildtools*"
          - "net.java.dev.jna:*"
          - "org.xerial:*"
        update-types: [minor, patch]
      # Android-only UI and platform libraries. CI proves these compile; what a screen renders
      # still needs the journeys.
      android-ui:
        patterns:
          - "androidx.*"
          - "com.google.android.*"
          - "io.coil-kt.coil3:*"
        update-types: [minor, patch]
      other:
        patterns: ["*"]
        update-types: [minor, patch]
