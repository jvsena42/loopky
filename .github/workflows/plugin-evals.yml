name: Agent plugin evals

# Whether the skill still makes Claude *do* the right thing (#388): trigger on a flashcards request,
# dry-run before writing, stop and hand an allowlist to the user, sign in again on exit 4. The
# static checks (`AgentPluginTest`, `claude plugin validate`) cannot see behaviour; these can.
#
# **Paid, so it runs once per release and on demand — never on a PR or a schedule.** `release.yml`
# calls it beside the build, and it gates nothing there: a nondeterministic LLM eval must not be
# able to stop an app release, and the plugin ships with the tag either way. A red job in the
# release run is the signal. Check a skill change before merging it with `claude plugin eval
# plugins/loopky --model sonnet --ablation none` locally, which bills a subscription, not the key.
on:
  workflow_call:
    inputs:
      baseline:
        description: 'Also run every case without the plugin'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Also run every case without the plugin, to measure how much the skill helps (doubles the cost)'
        type: boolean
        default: true

concurrency:
  group: plugin-evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: Plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Said out loud rather than a silent green, which would read as "the evals passed".
      - name: An API key is available
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set for this run, so the plugin evals did not run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '22'

      # Three runs a case and a 0.6 bar: a model is not deterministic, and one bad run in three is
      # noise where two is a regression. A case scores the mean of its runs, so one failed run is
      # 0.67 and two are 0.33 — the bar sits between. It was 0.8, which failed a case on one run: a
      # single judge's vote turned v1.2.0's and v1.2.2's release runs red on answers that met every
      # criterion. The cost ceiling bounds a runaway, not a normal run.
      #
      # No baseline arm by default. `plugin eval` runs every case a second time without the plugin
      # unless told not to, which is 46% of the bill ($0.67 of $1.46 on the first run) and answers
      # "how much does the skill help" — a question that does not change between releases. "Does it
      # still work" is the with-plugin score alone. A manual run measures the baseline when asked.
      #
      # Sonnet as the agent: measured locally at 3 runs a case, 12/12 at $0.53 against the default
      # model's 12/12 at ~$0.79. Haiku was 6/12 at $0.27 — it answers in one turn without loading
      # the skill, so every run would read as a regression. The judges stay on Haiku (default).
      - name: Run the evals
        if: steps.key.outputs.present == 'true'
        env:
          ABLATION: ${{ inputs.baseline && 'with-without' || 'none' }}
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code
          claude plugin eval plugins/loopky --trust-plugin --no-publish --ablation "$ABLATION" --model sonnet \
            --runs 3 --threshold 0.6 --max-cost-usd 5 \
            --json "$RUNNER_TEMP/evals.json" --report "$RUNNER_TEMP/evals.html"

      - name: Upload the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-evals
          path: |
            ${{ runner.temp }}/evals.json
            ${{ runner.temp }}/evals.html
          if-no-files-found: ignore
