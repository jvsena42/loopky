# One service per environment, started by deploy.sh with LOOPKY_MCP_ENV, IMAGE and HOST_PORT set.
# Staging and production are separate projects with separate data directories and master keys,
# because `switchNetwork` is process-global (#214).
name: loopky-mcp-${LOOPKY_MCP_ENV:?}

services:
  mcp:
    # Always a digest, never a tag: the digest is what was tested and approved (#486).
    image: ${IMAGE:?}
    restart: unless-stopped
    read_only: true
    # exec: JNA and sqlite-jdbc load their native libraries from here (see the Dockerfile).
    tmpfs:
      - /tmp:rw,exec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The JVM's own caps (Dockerfile) are sized to fit inside mem_limit, so the kernel never has
    # to SIGKILL it past a clean shutdown.
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    # Loopback only: Caddy terminates TLS in front. Nothing but 443 and 22 is open on the box.
    ports:
      - "127.0.0.1:${HOST_PORT:?}:8080"
    environment:
      LOOPKY_MCP_ENV: ${LOOPKY_MCP_ENV}
      LOOPKY_MCP_PUBLIC_URL: ${LOOPKY_MCP_PUBLIC_URL:?}
      LOOPKY_MCP_MASTER_KEY_FILE: /run/secrets/master_key
    volumes:
      - /srv/loopky-mcp/${LOOPKY_MCP_ENV}/data:/data
      - /etc/loopky-mcp/${LOOPKY_MCP_ENV}/master_key:/run/secrets/master_key:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
