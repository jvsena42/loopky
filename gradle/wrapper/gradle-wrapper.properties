distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
# Retry the distribution download. Every CI runner here is fresh, so every job fetches ~130 MB,
# and `retries=0` — the generated default — fails the whole job on a single blip. It cannot mask a
# real problem: `distributionSha256Sum` below still has to match whatever arrives.
retries=2
retryBackOffMs=500
validateDistributionUrl=true
# Pinned so the wrapper refuses a distribution that is not the one this repo was built against.
# `validateDistributionUrl` only checks the URL is well-formed; this checks the bytes. Update it
# together with `distributionUrl` — from https://services.gradle.org/distributions/<dist>.sha256.
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
