[versions]
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-core-splashscreen = "1.2.0"
androidx-credentials = "1.6.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-work = "2.11.2"
# AndroidX Compose. One BOM pins the whole family — runtime, foundation, ui, material3,
# material3-adaptive, the icon pack — to a set Google released together, so the artifacts below
# carry no version of their own. Loopky left Compose Multiplatform at #273: iOS is SwiftUI, and
# `:shared` has no Compose in it, so the JetBrains build bought nothing and cost an alpha pin.
composeBom = "2026.08.00"
junit = "4.13.2"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
jna = "5.19.1"
# The JVM component of the `rustls-platform-verifier` Rust crate. Must match the crate version
# pubky-core-ffi-fork depends on (Cargo.toml: rustls-platform-verifier = "0.7.0"), which vendors
# `rustls-platform-verifier-android` 0.1.1.
rustlsPlatformVerifier = "0.1.1"
detekt = "1.23.8"
# GraalVM `native-image` Gradle plugin (#210). Builds `loopky` as a single self-contained binary
# so the machine it lands on needs no JRE — see cli/build.gradle.kts.
graalvmNative = "1.1.12"
detektComposeRules = "0.4.22"
koin = "4.2.2"
navigationCompose = "2.10.0"
kvault = "1.12.0"
# JDBC SQLite for reading an Anki `.apkg` collection on the desktop JVM target, where SQLite is
# not in the platform the way it is on Android. Ships native libraries for linux-x86-64 and
# macos-aarch64 inside the jar, so the CLI needs nothing installed (#54).
sqliteJdbc = "3.53.4.0"
playServicesCodeScanner = "16.1.0"
coil = "3.6.2"
# QR encoding for the tablet Pubky Ring sign-in panel. Core only — the `android` artifact
# pulls in a camera/scanner stack we already cover with play-services-code-scanner.
zxing = "3.5.4"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# Credential Manager, for saving the recovery phrase into the user's password manager.
# `credentials-play-services-auth` is what routes a create/get to Google Password Manager
# below API 34, where the framework has no provider of its own; minSdk here is 29.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
compose-materialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
rustls-platform-verifier = { module = "rustls:rustls-platform-verifier", version.ref = "rustlsPlatformVerifier" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektComposeRules" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kvault = { module = "com.liftric:kvault", version.ref = "kvault" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "playServicesCodeScanner" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# `:shared`'s Android target. Replaces `com.android.library`, which AGP 9 refuses to sit beside
# `org.jetbrains.kotlin.multiplatform` in one subproject (#273). Versioned with AGP, being part of it.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
graalvmNative = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }