#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#loopky
# The headless client's version, and the single source of truth for it (#210). It reaches four
# places that used to be able to disagree: `loopky --version`, the `.deb`'s `Version:`, the
# container image tag, and the GitHub release. The release workflow refuses to run when the tag it
# was triggered by does not match this, rather than shipping four numbers and letting the user
# find out which one is true.
loopkyCliVersion=0.11.1

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true