#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#loopky
# The headless client's version, and the single source of truth for it (#210). It reaches four
# places that used to be able to disagree: `loopky --version`, the `.deb`'s `Version:`, the
# container image tag, and the GitHub release. The release workflow refuses to run when the tag it
# was triggered by does not match this, rather than shipping four numbers and letting the user
# find out which one is true.
loopkyCliVersion=0.11.1

#Android
# `android.nonTransitiveRClass` and `android.useAndroidX` were dropped at AGP 9 (#273) — both are
# defaults there.

#Kotlin/Native
# Incremental compilation of klib artifacts (#273). This is what the iOS edit-build-drive loop
# spends its time on, and it is the documented lever for it.
#
# **Beta, and off by default upstream** — so it is a real behaviour change, not a no-op, and no CI
# job can catch it going wrong: every runner is fresh, so klib incrementality is structurally a
# no-op there and a green matrix says nothing about this flag. Its failure mode is a stale klib
# surviving a source change, which shows up as a local iOS build that disagrees with the source.
# If an iOS build looks stale for no reason, turn this off before looking anywhere else.
kotlin.incremental.native=true
